id: sch1_p19_public_authority
gateway: da
enabled: true
paragraph: "19"
legal_ref: "Civil Legal Aid (Procedure) Regulations 2012, Schedule 1, paragraph 19"
guidance_ref: "LAA Evidence Requirements v15, paragraphs 2.83 to 2.85"
name: "Letter from a public authority confirming an assessment as a victim, or person at risk, of domestic abuse"
short_name: "Public authority letter"
names_other_party_required: true
applicant_must_be_victim: false
always_needs_caseworker: false
accepted_formats: ["letter", "email from an official address", "copy of the authority's assessment or report"]
classification_hints:
  - "letter, email or report from a council children's or adult social care service, an NHS body, a school, the police or another body exercising public functions, often on headed paper or from a .gov.uk, .nhs.uk or .police.uk address"
  - "key sentence says a named person 'was assessed as being, or at risk of being, a victim of domestic abuse by' a named other party"
  - "may instead be a copy of the assessment itself, such as a child and family assessment, a section 47 enquiry, a pre-proceedings letter or a child in need plan, that records domestic abuse by the other party"
  - "a housing officer's letter is paragraph 16 and a MARAC letter is paragraph 13; use this paragraph for other public bodies"
elements:
  - id: public_authority_named
    label: "Public authority identified"
    requirement: "The letter or assessment clearly identifies the name and details of the public authority, within the meaning of section 6 of the Human Rights Act 1998, that carried out the assessment."
    accept_if: "The name of a public authority appears in the letterhead, signature block, email domain or body: a local authority or its children's or adult social care service, a council department, an NHS trust or integrated care board, a maintained school or academy, a police force, a court or tribunal, a government department or agency, or a body carrying out public functions on a public authority's behalf (for example Cafcass or a children's trust). Note the authority and the department."
    reject_if: "The author is a private company, private nursery or private school, a private landlord, a charity or voluntary organisation (a domestic abuse charity is paragraph 17), a solicitor, or an individual acting in a private capacity; or no organisation is identified at all. Where an organisation is named but you cannot tell from the text whether it is a public authority (for example a contracted-out service, a social enterprise delivering council functions, or an independent school that may or may not be state-funded), use unclear rather than missing so a caseworker can decide."
    fix: "Put the full name and details of {author_org} on the letter and state the department that carried out the assessment."
    client_hint: "put the council or authority's name on the letter"
  - id: victim_named
    label: "Victim named, family relationship with B"
    requirement: "The letter names the person assessed as being, or at risk of being, a victim: the applicant, or another person in a family relationship with B."
    accept_if: "The victim is named (for example in a 'Name of applicant: Jane Doe' line or in the assessment sentence) and the letter states or clearly implies the family relationship with B ('a person with whom John Doe is or was in a family relationship', 'her husband', 'the children's father', 'his former partner'). The victim may be the applicant or another person in a family relationship with B, such as a child named in a children's services assessment. If the person named is the applicant on the legal aid application, the family relationship with B is established by the application and need not be restated in the letter; whether B is named is checked separately under perpetrator_named."
    reject_if: "No victim is named; only an unfilled placeholder such as [name of applicant] is given; or the victim is someone other than the applicant and nothing links them to B as a family member or current or former partner. If the name does not match the applicant on the application and the letter does not explain who the person is, use unclear rather than missing."
    fix: "Name {applicant_name} as the person assessed and state their relationship to {other_party_name} (for example former partner or spouse)."
    client_hint: "add your full name"
  - id: perpetrator_named
    label: "Other party named"
    requirement: "The letter names B, the other party to the legal aid application, as the person by whom the victim was assessed as being, or at risk of being, abused."
    accept_if: "The other party's name appears as the perpetrator, for example in a 'Name of perpetrator: John Doe' line or in 'victim of domestic abuse by John Doe'. In a copy of an assessment, B being named as the parent or partner whose behaviour is the concern counts."
    reject_if: "No perpetrator is named; the abuser is only described ('the father', 'her ex-partner', 'the respondent') with no name anywhere in the document; or the person named is not the other party on the application. A different name is unclear rather than missing if it could be a spelling variant, maiden name or alias."
    fix: "Name {other_party_name} as the person by whom {applicant_name} was assessed as being, or at risk of being, a victim of domestic abuse."
    client_hint: "name the other person"
  - id: assessed_victim_or_at_risk
    label: "Assessed as victim or at risk"
    requirement: "The letter confirms that the victim was assessed by the public authority as being, or at risk of being, a victim of domestic abuse by B, or the document is a copy of that assessment."
    accept_if: "A definite confirmation of an assessment outcome: 'was assessed as being, or at risk of being, a victim of domestic abuse by John Doe', 'our assessment concluded that Jane Doe has experienced domestic abuse from John Doe', 'the child and family assessment identified Jane Doe as a victim of domestic abuse by John Doe', or a copy of the assessment itself in which domestic abuse by B is recorded as a finding or an identified risk. The assessment need not be a formal one: a pre-proceedings letter or similar document recording the authority's conclusion counts (guidance 2.85)."
    reject_if: "The wording is hedged or speculative rather than an assessment outcome: 'might be a victim' (the MoJ rejected example), 'may be', 'could be', 'possibly', 'appears to', 'potentially at risk', 'concerns were raised'; the letter only records the victim's allegation or self-report without the authority's own assessment ('she has told us', 'she alleges'); it only confirms the authority is 'working with' or 'involved with' the family, or that a referral was made or an assessment is pending or ongoing with no outcome; or the assessment concerns abuse by someone other than B."
    fix: "State that {author_org} assessed {applicant_name} as being, or at risk of being, a victim of domestic abuse by {other_party_name}, without qualification, or enclose a copy of the assessment that records this."
    client_hint: "say clearly that they assessed you as a victim, or at risk, of abuse by that person, without words like 'might'"
hedge_terms: []
gov_template_url: "https://www.gov.uk/government/publications/letter-from-a-public-authority-as-evidence-of-domestic-abuse"
test_cases_min: 5
