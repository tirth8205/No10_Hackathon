id: sch1_p12_health_referral
gateway: da
enabled: true
paragraph: "12"
legal_ref: "Civil Legal Aid (Procedure) Regulations 2012, Schedule 1, paragraph 12"
guidance_ref: "LAA Evidence Requirements v15, paragraphs 2.61 to 2.65"
name: "Letter or report confirming a referral by an appropriate health professional to a domestic abuse support service"
short_name: "Health professional referral"
names_other_party_required: false
applicant_must_be_victim: true
always_needs_caseworker: false
accepted_formats:
  - "letter or report from an appropriate health professional on letterhead"
  - "email from an appropriate health professional identifying which organisation it is from"
  - "letter or report from the domestic abuse support service referred to"
  - "email from the domestic abuse support service identifying which service it is from"
  - "letter or email from a health professional based overseas naming their registered body (must be in English or come with a translation and the original)"
classification_hints:
  - "written either by a GP, nurse, health visitor, midwife or other health professional, or by a domestic abuse support service, and its subject is a referral"
  - "says 'I referred' the client, or the client 'was referred to us by' a named GP, health visitor, midwife or nurse, to a named domestic abuse organisation, IDVA service, outreach service or refuge"
  - "the key facts are who made the referral and which service received it, not an examination or diagnosis (that is paragraph 11)"
  - "may describe the receiving organisation as a specialist service for victims of domestic abuse"
elements:
  - id: applicant_named
    label: "Applicant named as person referred"
    requirement: "The applicant (A) is named as the person who was referred."
    accept_if: "The applicant's name appears as the person referred, in any form (full name, title and surname, or a 'Re:' line)."
    reject_if: "No name, or only an unfilled placeholder such as [name of applicant]. If the name differs from the application, use 'unclear' and refer to the caseworker."
    fix: "Name {applicant_name} as the person who was referred."
  - id: referral_by_ahp
    label: "Referral made by health professional"
    requirement: "The referral was made by an appropriate health professional as defined in Schedule 1 paragraph 22: a medical practitioner, nurse, midwife, dentist, paramedic, practitioner psychologist, radiographer or social worker."
    accept_if: "The letter identifies who made the referral and that person is a qualifying health professional: GP, hospital doctor, psychiatrist, nurse, health visitor, school nurse, midwife, dentist, paramedic, practitioner psychologist, radiographer or social worker. 'I referred' in a GP's own letter counts; so does 'referred to us by her GP / health visitor / midwife' in the service's letter. A registration number is not needed for the referrer when the letter comes from the service."
    reject_if: "The applicant self-referred, or was referred by someone who is not an appropriate health professional: a teacher or other school staff, the police, a solicitor, a housing officer, a counsellor or therapist, a friend or family member, or an unnamed agency. Also fails if no referrer is identified. Use 'unclear' if the referrer is described only as 'a clinician', 'the surgery' or 'the hospital' with no role given."
    fix: "State that the referral of {applicant_name} was made by an appropriate health professional and give that person's name and role (for example GP, health visitor, midwife, nurse or social worker)."
  - id: specialist_da_service
    label: "Referred to specialist domestic abuse service"
    requirement: "The referral was to a person or organisation that provides specialist support or assistance for victims of, or those at risk of, domestic abuse (guidance 2.63)."
    accept_if: "The receiving organisation is named and identified as a domestic abuse service: a domestic abuse charity, Women's Aid or Refuge service, an IDVA service, a refuge, a domestic abuse outreach or helpline service, or a service the letter describes as providing specialist support to victims of domestic abuse. A letter from the service describing itself as a specialist domestic abuse service counts."
    reject_if: "The referral was to a general or non-specialist service: NHS Talking Therapies or IAPT, counselling, a mental health or community mental health team, Citizens Advice, social prescribing, housing, a food bank, or a generic 'support service' with nothing to show it specialises in domestic abuse. Also fails if no destination is named. Use 'unclear' if an organisation is named but the letter says nothing about what it does and the assessor cannot tell from the name."
    fix: "Name the organisation {applicant_name} was referred to and confirm that it provides specialist support or assistance for victims of, or those at risk of, domestic abuse."
  - id: author_eligible
    label: "Letter from an eligible author"
    requirement: "The letter or report is from (a) the appropriate health professional who made the referral, (b) an appropriate health professional who has access to the applicant's medical records, or (c) the person or organisation to whom the referral was made (guidance 2.62)."
    accept_if: "The author is the referring health professional (for example the GP who writes 'I referred'), a different appropriate health professional who states they have access to the applicant's medical records (for example a GP at the same practice writing from the notes), or the domestic abuse support service that received the referral (a manager or worker writing on the service's behalf)."
    reject_if: "The author is none of these: for example the applicant's solicitor, a friend, a school, the police or a charity that did not receive the referral. Use 'unclear' rather than 'missing' if the author is a health professional who is neither the referrer nor says they have access to the applicant's records, if the author's role or organisation cannot be identified, or if the letter is not in English and no translation is supplied."
    fix: "Make sure the letter is written by the health professional who made the referral, by a health professional who has access to {applicant_name}'s medical records, or by the service that received the referral, and say which of these applies."
hedge_terms: []
gov_template_url: "https://www.gov.uk/government/publications/proof-of-a-referral-to-a-domestic-abuse-support-service"
test_cases_min: 5
