id: sch1_p13_marac
gateway: da
enabled: true
paragraph: "13"
legal_ref: "Civil Legal Aid (Procedure) Regulations 2012, Schedule 1, paragraph 13"
guidance_ref: "LAA Evidence Requirements v15, paragraphs 2.66 to 2.67"
name: "Letter from a member of a multi-agency risk assessment conference (MARAC) or other suitable local safeguarding forum"
short_name: "MARAC member letter"
names_other_party_required: true
applicant_must_be_victim: false
always_needs_caseworker: false
accepted_formats:
  - "letter from a member of a MARAC or other suitable local safeguarding forum"
  - "report from a member of a MARAC or other suitable local safeguarding forum"
  - "email from a forum member identifying which organisation it is from"
  - "minutes of a MARAC or other suitable local safeguarding forum"
classification_hints:
  - "headed or signed by a MARAC coordinator, chair or representative, or by a member agency (police, probation, health, housing, education, social services, IDVA service, Cafcass) writing about the forum"
  - "says the client's case was referred to, heard at or discussed by MARAC or a named multi-agency safeguarding forum, often with the meeting date and the actions or safety plan agreed"
  - "uses MARAC language: 'high risk of serious harm', 'DASH risk assessment', 'multi-agency safety plan', 'police markers on the address'"
  - "names both the person at risk (the client or their child) and the person posing the risk"
elements:
  - id: author_forum_member
    label: "Author is a forum member"
    requirement: "The author is a member of a multi-agency risk assessment conference (MARAC) or of another suitable local safeguarding forum made up of more than one agency (guidance 2.66)."
    accept_if: "The author states they are a MARAC coordinator, chair, administrator or member, or a representative of a member agency (police, probation, prison service, health, housing, education, social services, IDVA or other domestic abuse adviser, women's, men's or victim support service, drug and alcohol service, Cafcass or Cafcass Cymru) writing about the forum, or the document is the forum's own minutes. A forum other than MARAC qualifies if the letter shows it involves more than one agency; the list in guidance 2.67 is not exhaustive."
    reject_if: "The author does not claim membership of MARAC or any multi-agency forum (for example a support worker writing only about their own service's work), or the forum described is one agency's internal meeting. Use 'unclear' if the author names a forum the assessor does not recognise as multi-agency and the letter does not say which agencies sit on it."
    fix: "State in the letter that you are a member of the MARAC, or name the local multi-agency safeguarding forum you sit on and the agencies that make it up."
  - id: victim_named
    label: "Victim is applicant or family member"
    requirement: "The person at risk is named and is the applicant (A), or a person with whom the applicant is in a family relationship, such as their child."
    accept_if: "The applicant is named as the person at risk; or another named person is identified as the applicant's child, parent, sibling or other family member and the applicant is also identified. Title and surname is enough."
    reject_if: "No victim is named, only an unfilled placeholder such as [name of applicant], or the person at risk is named but has no stated family relationship with the applicant (for example a neighbour or friend). If the named victim does not match the application, use 'unclear' and refer to the caseworker."
    fix: "Name {applicant_name}, or the family member at risk and their relationship to {applicant_name}, as the person at risk of harm."
  - id: perpetrator_named
    label: "Other party named as source of risk"
    requirement: "The other party (B) is named as the person from whom the risk of domestic abuse arises; B must be the other party in the case."
    accept_if: "The other party's full name, or title and surname, appears as the person posing the risk (for example 'at high risk of serious harm from domestic abuse by John Smith, her former partner'). A relationship label alongside the name is helpful but not required."
    reject_if: "The source of risk is described only as 'a former partner', 'her ex', 'the perpetrator', 'the father of the children' or similar with no name. If the person named is not the other party in the application, use 'unclear' and refer to the caseworker."
    fix: "Name {other_party_name} as the person from whom {applicant_name} (or the family member) is or has been at risk of harm."
  - id: at_risk_of_harm_from_other_party
    label: "Confirms risk of harm from other party"
    requirement: "The letter confirms that the victim is or has been at risk of harm from domestic abuse by B."
    accept_if: "A statement that the victim is, was or has been at risk of harm (any level, including 'high risk of serious harm') from domestic abuse by the named other party, including that the case was heard at MARAC and a safety plan or actions were agreed. Past risk ('has been') counts."
    reject_if: "The letter says the referral did not meet the MARAC threshold, the case was not heard, or the case was closed with no finding of risk; or it only confirms that a referral was made without confirming risk. Also fails if the risk is from someone other than the named other party, or the statement is hedged ('may be at risk', 'possibly at risk'). 'Unclear' if the key sentence is illegible."
    fix: "Confirm that {applicant_name} (or the named family member) is or has been at risk of harm from domestic abuse by {other_party_name}, for example by stating that the case was heard at MARAC and what was agreed."
hedge_terms: []
gov_template_url: "https://www.gov.uk/government/publications/get-proof-that-support-agencies-have-made-a-joint-protection-plan"
test_cases_min: 5
