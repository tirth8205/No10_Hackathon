<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip 6 · The knock-on</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: Arial, "Helvetica Neue", sans-serif; color: #0b0c0c; background: #f3f2f1; position: relative; }

  .chip { position: absolute; left: 96px; top: 56px; font-size: 36px; font-weight: 700; color: #fff; background: #0b0c0c;
          padding: 10px 22px; letter-spacing: .02em; animation: fade .6s ease-out .1s both; }
  .footer { position: absolute; right: 96px; top: 70px; font-size: 30px; color: #505a5f;
            animation: fade .6s ease-out .4s both, fadeOut .3s ease-in 6.4s forwards; }

  .stage { position: absolute; left: 96px; top: 150px; width: 1728px; height: 720px; }

  /* Phase A: two loops collapse into one review (order follows clip 2: Caseworker · Solicitor · Jane) */
  .diagram { position: absolute; inset: 0; animation: fadeIn .5s ease-out .1s both, fadeOut .3s ease-in 6.3s forwards; }
  .node { position: absolute; top: 250px; width: 400px; height: 180px; background: #fff; border: 6px solid #0b0c0c; border-radius: 90px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .node b { display: block; font-size: 60px; }
  .node span { display: block; font-size: 40px; color: #505a5f; margin-top: 4px; }
  .n1 { left: 0; } .n2 { left: 664px; } .n3 { left: 1328px; }
  .n1 { animation: cwglow .6s ease-out 4.9s both; }
  svg.loops { position: absolute; left: 0; top: 0; width: 1728px; height: 720px; overflow: visible; }
  .chase  { animation: loopOut .8s ease-in 1.4s both; transform-origin: 1196px 340px; }
  .return { animation: loopOut .8s ease-in 3.6s both; transform-origin: 532px 340px; }
  .loop path { fill: none; stroke: #d4351c; stroke-width: 9; stroke-dasharray: 26 16; }
  .loop text { font: 700 52px Arial; fill: #d4351c; letter-spacing: .04em; }
  .straight line { stroke: #00703c; stroke-width: 16; stroke-dasharray: 300; stroke-dashoffset: 300; }
  .s1 { animation: draw .45s ease-out 2.2s forwards; }
  .s2 { animation: draw .45s ease-out 4.4s forwards; }
  .head1 { animation: fadeIn .12s linear 2.58s both; }
  .head2 { animation: fadeIn .12s linear 4.78s both; }
  .one { position: absolute; left: 0; width: 1728px; top: 500px; text-align: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1) 5.2s both; }
  .one b { display: inline-block; font-size: 96px; color: #fff; background: #00703c; padding: 18px 56px; }

  /* Phase B: a person decides */
  .person { position: absolute; inset: 0; background: #fff; border-top: 14px solid #1d70b8; box-shadow: 0 2px 6px rgba(0,0,0,.12);
            display: flex; align-items: center; gap: 80px; padding: 0 120px;
            animation: rise .5s cubic-bezier(.2,.8,.2,1) 6.6s both; }
  .avatar { position: relative; flex: none; width: 320px; height: 320px; border-radius: 50%; background: #e8f1f8; overflow: hidden; }
  .avatar::before { content: ""; position: absolute; left: 105px; top: 52px; width: 110px; height: 110px; border-radius: 50%; background: #1d70b8; }
  .avatar::after { content: ""; position: absolute; left: 60px; top: 185px; width: 200px; height: 180px; border-radius: 100px 100px 0 0; background: #1d70b8; }
  .person .ttl { font-size: 120px; font-weight: 700; line-height: 1.05; }
  .person .sub { font-size: 64px; color: #505a5f; font-weight: 700; margin-top: 28px; animation: fadeIn .4s ease-out 7.6s both; }

  /* Phase C: the stat */
  .stat { position: absolute; inset: 0; background: #fff; border-left: 18px solid #00703c;
          box-shadow: 0 2px 6px rgba(0,0,0,.12); padding: 50px 100px; animation: rise .6s cubic-bezier(.2,.8,.2,1) 9.0s both; }
  .stat .big { font-size: 250px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .stat .big small { margin-left: 40px; font-size: 120px; color: #505a5f; font-weight: 700; }
  .stat .lead { font-size: 72px; font-weight: 700; line-height: 1.1; margin-top: 16px; animation: fadeIn .5s ease-out 9.8s both; }
  .dots { display: flex; gap: 18px; margin-top: 70px; align-items: center; }
  .dot { width: 96px; height: 96px; background: #00703c; color: #fff; font-size: 56px; font-weight: 700;
         display: flex; align-items: center; justify-content: center; }
  .dot.miss { background: #fff; color: #0b0c0c; border: 6px solid #0b0c0c; font-size: 52px; }
  .miss-note { display: inline-block; font-size: 60px; font-weight: 700; margin-top: 60px; padding: 6px 0 6px 26px; border-left: 12px solid #0b0c0c;
               animation: fadeIn .6s ease-out 12.4s both; }

  .caption { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; background: #0b0c0c; color: #fff;
             animation: up .6s cubic-bezier(.2,.8,.2,1) 5.0s both; }
  .caption b { position: absolute; left: 96px; top: 0; height: 180px; display: flex; align-items: center; font-size: 64px; white-space: nowrap; }
  .caption .y { color: #ffdd00; margin-left: .3em; }
  .c1 { animation: fadeOut .3s ease-in 9.0s forwards; }
  .c2 { animation: fadeIn .4s ease-out 9.3s both; }

  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
  @keyframes loopOut { from { opacity: 1; transform: scale(1) } to { opacity: 0; transform: scale(.85) } }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: scale(1) } }
  @keyframes up { from { transform: translateY(180px) } to { transform: none } }
  @keyframes cwglow { from { border-color: #0b0c0c } to { border-color: #00703c } }
  @keyframes dotIn { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
  <div class="chip">WITH GATEWAY CHECK</div>
  <div class="footer">All names fictional.</div>

  <div class="stage">
    <!-- Phase A -->
    <div class="diagram">
      <svg class="loops" viewBox="0 0 1728 720">
        <defs>
          <marker id="ar" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#d4351c" style="stroke:none"/></marker>
        </defs>
        <g class="loop return">
          <path d="M300,245 Q532,40 750,245" marker-end="url(#ar)"/>
          <path d="M750,436 Q532,640 300,436" marker-end="url(#ar)"/>
          <text x="532" y="110" text-anchor="middle">RETURN</text>
        </g>
        <g class="loop chase">
          <path d="M1428,245 Q1196,40 978,245" marker-end="url(#ar)"/>
          <path d="M978,436 Q1196,640 1428,436" marker-end="url(#ar)"/>
          <text x="1196" y="110" text-anchor="middle">CHASE</text>
        </g>
        <g class="straight">
          <line class="s1" x1="1322" y1="340" x2="1100" y2="340"/><polygon class="head1" points="1104,312 1056,340 1104,368" fill="#00703c"/>
          <line class="s2" x1="658" y1="340" x2="436" y2="340"/><polygon class="head2" points="440,312 392,340 440,368" fill="#00703c"/>
        </g>
      </svg>
      <div class="node n1"><b>Caseworker</b></div>
      <div class="node n2"><b>Solicitor</b></div>
      <div class="node n3"><b>Jane</b><span>optional</span></div>
    </div>

    <!-- Phase B -->
    <div class="person">
      <div class="avatar"></div>
      <div><div class="ttl">A person<br>decides</div><div class="sub">Not the check</div></div>
    </div>

    <!-- Phase C -->
    <div class="stat">
      <div class="big">11<small>of 12</small></div>
      <div class="dots">
        <div class="dot" style="animation: dotIn .3s ease-out 10.4s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 10.5s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 10.6s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 10.7s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 10.8s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 10.9s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 11.0s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 11.1s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 11.2s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 11.3s both">✓</div>
        <div class="dot" style="animation: dotIn .3s ease-out 11.4s both">✓</div>
        <div class="dot miss" style="animation: dotIn .3s ease-out 11.8s both">↩</div>
      </div>
      <div class="miss-note">Miss: sent back, not approved</div>
    </div>
  </div>

  <div class="caption">
    <b class="c1">Two loops →<span class="y">one review.</span></b>
    <b class="c2">Matched experts on MoJ examples.</b>
  </div>
</body>
</html>
