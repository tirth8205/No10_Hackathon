<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip 7 · Incentive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: Arial, "Helvetica Neue", sans-serif; color: #0b0c0c; background: #f3f2f1; position: relative; }

  .chip { position: absolute; left: 96px; top: 64px; font-size: 36px; font-weight: 700; color: #fff; background: #0b0c0c;
          padding: 10px 22px; letter-spacing: .02em; animation: fade .6s ease-out .2s both; }
  .footer { position: absolute; right: 96px; top: 80px; font-size: 28px; color: #505a5f;
            animation: fade .6s ease-out .6s both, out .5s ease-in 3.4s forwards; }

  /* Phase 1: less unpaid rework (0 – 3.4 s) */
  .p1 { position: absolute; left: 96px; top: 200px; width: 1728px; animation: out .5s ease-in 3.4s forwards; }
  .rework { display: flex; align-items: center; gap: 32px; animation: slide .5s ease-out .4s both; }
  .tick { width: 104px; height: 104px; border-radius: 50%; background: #00703c; flex: none; position: relative; }
  .tick::after { content: ""; position: absolute; left: 34px; top: 18px; width: 26px; height: 50px; border: solid #fff;
                 border-width: 0 11px 11px 0; transform: rotate(45deg); }
  .rework b { font-size: 104px; line-height: 1; }
  .shot { margin-top: 70px; margin-left: 136px; width: 1400px; background: #fff; border-top: 10px solid #00703c;
          box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 18px 48px rgba(0,0,0,.12); padding: 40px 42px;
          animation: rise .8s cubic-bezier(.2,.8,.2,1) 1.0s both; }
  .crop { width: 1316px; height: 168px; overflow: hidden; position: relative; }
  .crop img { position: absolute; width: 1904px; left: -28px; top: -336px; } /* source 1360px wide x1.4; crops the name + status tag */

  /* Phase 2: days to approval (3.6 s on) */
  .p2 { position: absolute; left: 96px; top: 170px; width: 1728px; }
  .p2 h2 { font-size: 80px; font-weight: 700; animation: rise .6s cubic-bezier(.2,.8,.2,1) 3.7s both; }
  .p2 h2 span { font-weight: 400; color: #505a5f; }
  .row { position: absolute; left: 0; display: flex; align-items: center; }
  .r1 { top: 170px; } .r2 { top: 390px; }
  .lab { width: 400px; font-size: 56px; font-weight: 700; line-height: 1.05; }
  .r1 .lab { animation: fade .4s ease-out 4.0s both; }
  .r2 .lab { animation: fade .4s ease-out 6.0s both; }
  .track { position: relative; height: 150px; width: 1328px; }
  .fill { position: absolute; left: 0; top: 0; height: 150px; transform-origin: left center; }
  .r1 .fill { width: 680px; background: #00703c; animation: grow 1.2s cubic-bezier(.3,.8,.3,1) 4.2s both; }
  .r2 .fill.base { width: 680px; background: #6f777b; animation: grow 1s cubic-bezier(.3,.8,.3,1) 6.2s both; }
  .r2 .fill.extra { left: 680px; width: 540px; background: repeating-linear-gradient(135deg, #d4351c 0 18px, #b52d17 18px 36px);
                    animation: grow 1.1s cubic-bezier(.3,.8,.3,1) 7.1s both; }
  .r2 .more { position: absolute; left: 1220px; top: 0; height: 150px; width: 90px;
              background: repeating-linear-gradient(90deg, #d4351c 0 14px, transparent 14px 28px); opacity: .45;
              -webkit-mask: linear-gradient(90deg, #000, transparent); animation: fade .5s ease-out 8.1s both; }
  .num { position: absolute; top: 0; height: 150px; line-height: 150px; font-size: 96px; font-weight: 700; color: #fff; }
  .r1 .num { left: 680px; transform: translateX(-100%); padding-right: 30px; animation: fade .5s ease-out 5.1s both; }
  .r2 .num { left: 1220px; transform: translateX(-100%); padding-right: 30px; animation: fade .5s ease-out 8.0s both; }
  .r2 .num span { background: #0b0c0c; padding: 0 14px; }
  .guide { position: absolute; left: 1080px; top: 170px; width: 0; height: 540px; border-left: 6px dashed #0b0c0c;
           animation: fade .4s ease-out 8.2s both; }

  .caption { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; background: #0b0c0c; color: #fff;
             display: flex; align-items: center; padding: 0 96px; animation: up .6s cubic-bezier(.2,.8,.2,1) 9.6s both; }
  .caption b { font-size: 72px; }

  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes out { from { opacity: 1 } to { opacity: 0; transform: translateY(-30px) } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) } to { opacity: 1; transform: none } }
  @keyframes slide { from { opacity: 0; transform: translateX(30px) } to { opacity: 1; transform: none } }
  @keyframes up { from { transform: translateY(180px) } to { transform: none } }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
</style>
</head>
<body>
  <div class="chip">WITH GATEWAY CHECK</div>
  <div class="footer">All names fictional.</div>

  <div class="p1">
    <div class="rework"><span class="tick"></span><b>Less unpaid rework</b></div>
    <div class="shot"><div class="crop"><img src="case-header.png" alt="Jane Doe: Meets the requirements"></div></div>
  </div>

  <div class="p2">
    <h2>Days to approval <span>(estimate)</span></h2>
    <div class="row r1">
      <div class="lab">First time</div>
      <div class="track"><div class="fill"></div><div class="num">13</div></div>
    </div>
    <div class="row r2">
      <div class="lab">Returned</div>
      <div class="track"><div class="fill base"></div><div class="fill extra"></div><div class="more"></div><div class="num"><span>23+</span></div></div>
    </div>
    <div class="guide"></div>
  </div>

  <div class="caption"><b>Faster approval brings payment closer.</b></div>
</body>
</html>
